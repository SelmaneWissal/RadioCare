version: "3.8"

services:
  postgres:
    image: postgres:15-alpine
    container_name: radiocare_postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10

  minio:
    image: bitnamilegacy/minio:2025.7.23-debian-12-r5
    container_name: radiocare_minio
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    ports:
      - "${MINIO_PORT}:9000"
      - "${MINIO_CONSOLE_PORT}:9001"
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 10

  airflow:
    image: apache/airflow:2.8.0-python3.9
    container_name: radiocare_airflow
    environment:
      AIRFLOW_HOME: ${AIRFLOW_HOME}
      AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: ${AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION}
      AIRFLOW__CORE__LOAD_EXAMPLES: ${AIRFLOW__CORE__LOAD_EXAMPLES}
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: ${AIRFLOW__DATABASE__SQL_ALCHEMY_CONN}
      AIRFLOW__WEBSERVER__PORT: ${AIRFLOW__WEBSERVER__PORT}
      AIRFLOW__WEBSERVER__BASE_URL: ${AIRFLOW__WEBSERVER__BASE_URL}
      AIRFLOW__SCHEDULER__ENABLE_SCHEDULING: ${AIRFLOW__SCHEDULER__ENABLE_SCHEDULING}
      PYTHONPATH: /opt/airflow/src
    ports:
      - "${AIRFLOW__WEBSERVER__PORT}:8080"
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./src:/opt/airflow/src
      - ./dags_logs:/opt/airflow/logs
    depends_on:
      postgres:
        condition: service_healthy
    command: >
      bash -c "
        airflow db migrate &&
        airflow users create --username admin --firstname Radio --lastname Care --role Admin --email admin@radiocare.local --password admin ||
        true &&
        airflow webserver &
        airflow scheduler
      "

  dbt:
    image: ghcr.io/dbt-labs/dbt-postgres:1.8.0
    container_name: radiocare_dbt
    working_dir: /opt/dbt
    environment:
      DBT_POSTGRES_HOST: ${POSTGRES_HOST}
      DBT_POSTGRES_USER: ${POSTGRES_USER}
      DBT_POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      DBT_POSTGRES_DB: ${POSTGRES_DB}
      DBT_POSTGRES_PORT: ${POSTGRES_PORT}
      DBT_SCHEMA: public
    volumes:
      - ./dbt:/opt/dbt
    depends_on:
      postgres:
        condition: service_healthy
    command: sleep infinity

volumes:
  postgres_data:
  minio_data:
