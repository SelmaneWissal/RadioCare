version: 2

sources:
  - name: raw
    database: "{{ var('database', target.database) }}"
    schema: bronze
    tables:
      - name: sites
        identifier: sites
        description: "Inventaire des sites (source brute)"
        columns:
          - name: site_id
            tests:
              - unique
              - not_null
          - name: site_name
            tests:
              - not_null
          - name: criticality
            tests:
              - not_null
      - name: equipments
        identifier: equipments
        description: "Inventaire des équipements (source brute)"
        columns:
          - name: equipment_id
            tests:
              - unique
              - not_null
          - name: site_id
            tests:
              - not_null
              - relationships:
                  to: ref('stg_sites')
                  field: site_id
          - name: equipment_type
            tests:
              - not_null
          - name: installation_date
            tests:
              - not_null
      - name: incidents
        identifier: incidents
        description: "Historique des incidents (source brute)"
        columns:
          - name: incident_id
            tests:
              - unique
              - not_null
          - name: equipment_id
            tests:
              - not_null
              - relationships:
                  to: ref('stg_equipments')
                  field: equipment_id
          - name: incident_type
            tests:
              - not_null
          - name: severity
            tests:
              - not_null
              - accepted_values:
                  values: ['Faible', 'Moyenne', 'Élevée', 'Critique']
          - name: start_time
            tests:
              - not_null
          - name: status
            tests:
              - not_null
              - accepted_values:
                  values: ['Ouvert', 'En cours', 'Cloturé', 'En attente']
      - name: maintenance
        identifier: maintenance
        description: "Historique des interventions de maintenance (source brute)"
        columns:
          - name: maintenance_id
            tests:
              - unique
              - not_null
          - name: incident_id
            tests:
              - not_null
              - relationships:
                  to: ref('stg_incidents')
                  field: incident_id
          - name: equipment_id
            tests:
              - not_null
          - name: result
            tests:
              - not_null
      - name: telemetry
        identifier: telemetry
        description: "Mesures techniques des équipements (source brute)"
        columns:
          - name: event_id
            tests:
              - unique
              - not_null
          - name: equipment_id
            tests:
              - not_null
              - relationships:
                  to: ref('stg_equipments')
                  field: equipment_id
